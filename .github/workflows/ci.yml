name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git libgmp-dev libgtest-dev lcov

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure a coverage build on RELIC's GMP backend, fetching RELIC for every curve
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DRBP_ENABLE_COVERAGE=ON -DRBP_ARITH=gmp

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Enforce 100% line coverage
        run: |
          lcov --capture --directory build --output-file all.info --filter brace,blank \
               --ignore-errors mismatch,inconsistent,unused,negative
          lcov --extract all.info "$PWD/src/*" "$PWD/include/rbp/*" --output-file coverage.info --ignore-errors unused
          lcov --summary coverage.info --fail-under-lines 100

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.info
          disable_search: true
          flags: unittests
          fail_ci_if_error: true

  package:
    name: Optimized build, install and demo
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git libgmp-dev libgtest-dev

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure an optimized build, fetching RELIC for every curve
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests on the optimized build
        run: ctest --test-dir build --output-on-failure

      - name: Install the package
        run: |
          sudo cmake --install build
          sudo ldconfig

      - name: Build and run the demo against the installed package
        run: |
          cmake -B demo/build -S demo
          cmake --build demo/build --parallel
          ./demo/build/demo
