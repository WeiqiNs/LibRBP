name: Github CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-coverage-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git libgmp-dev libgtest-dev lcov

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure with coverage, fetching and building RELIC for every curve
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DRBP_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests on every curve, including the exported-symbol check
        run: ctest --test-dir build --output-on-failure

      - name: Enforce 100% line coverage
        run: |
          lcov --capture --directory build --output-file all.info --filter brace,blank \
               --ignore-errors mismatch,inconsistent,unused,negative
          lcov --extract all.info "$PWD/src/*" "$PWD/include/rbp/*" --output-file coverage.info --ignore-errors unused
          lcov --summary coverage.info --fail-under-lines 100

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          flags: unittests
          fail_ci_if_error: true

      - name: Build and install a release package
        run: |
          cmake -B release -S . -DCMAKE_BUILD_TYPE=Release -DRBP_BUILD_TESTS=OFF
          cmake --build release --parallel
          sudo cmake --install release
          sudo ldconfig

      - name: Build and run the demo against the installed package
        run: |
          cmake -B demo/build -S demo
          cmake --build demo/build --parallel
          ./demo/build/demo
